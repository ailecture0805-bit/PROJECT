<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오</title>
  <style>
    /* 전체 배경을 밝은 화이트 톤으로 설정 */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #e9ecef;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 40px 20px;
    }

    /* 메인 레이아웃 컨테이너 */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    /* 좌측 이미지 카드: 잘리지 않고 위아래 비율 전체가 나오도록 설정 */
    .photo-card {
      flex: 1;
      max-width: 450px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .photo-card img {
      width: 100%;
      height: auto;          /* 비율 고정 */
      object-fit: contain;   /* 이미지 잘림(Crop) 방지 */
      display: block;
      border-radius: 8px;
    }

    /* 우측 내용 영역 (추후 다른 내용 추가용) */
    .content-card {
      flex: 1.2;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    /* 모바일 반응형 처리 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .photo-card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 좌측: 위아래로 길게 원본 비율을 살려 보여주는 사진 카드 -->
    <div class="photo-card">
      <img src="profile.jpg" alt="사진" />
    </div>

    <!-- 우측: 지정하신 불필요 텍스트 칸들은 전부 제거된 상태입니다 -->
    <div class="content-card">
      <!-- 여기에 추후 넣고 싶으신 다른 내용을 자유롭게 추가하시면 됩니다 -->
    </div>
  </div>

</body>
</html>
