<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이원우의 졸업 과제 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      word-break: keep-all;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen py-10 px-4 sm:px-8">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <header class="border-b border-slate-200 pb-6">
      <div class="inline-block bg-slate-900 text-white text-sm font-semibold px-3 py-1.5 rounded-md mb-3 shadow-sm">
        이원우의 졸업 과제 기록
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
        융합 프로젝트: 더 안전한 기계식 주차장
      </h1>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      
      <div class="space-y-6">
        <section class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col h-[400px]">
          <h2 class="text-lg font-semibold text-slate-900 mb-3 flex items-center gap-2 shrink-0">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-900 shrink-0"></span>
            PLC와 아두이노로 제어하는 기계식 주차장 모형
          </h2>
          <div class="bg-slate-100 rounded-lg overflow-hidden w-full flex-1 flex items-center justify-center min-h-0">
            <img src="project01.jpg" class="max-w-full max-h-full object-contain block rounded-lg" />
          </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col h-[400px]">
          <h2 class="text-lg font-semibold text-slate-900 mb-3 flex items-center gap-2 shrink-0">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-900 shrink-0"></span>
            프로젝트 발표
          </h2>
          <div class="bg-slate-100 rounded-lg overflow-hidden w-full flex-1 flex items-center justify-center min-h-0">
            <img src="project03.jpg" class="max-w-full max-h-full object-contain block rounded-lg" />
          </div>
        </section>
      </div>

      <div class="space-y-6">
        <section class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col h-[400px]">
          <h2 class="text-lg font-semibold text-slate-900 mb-3 flex items-center gap-2 shrink-0">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-900 shrink-0"></span>
            PLC용 터치패드
          </h2>
          <div class="bg-slate-100 rounded-lg overflow-hidden w-full flex-1 flex items-center justify-center min-h-0">
            <img src="project02.jpg" class="max-w-full max-h-full object-contain block rounded-lg" />
          </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col h-[400px]">
          <h2 class="text-lg font-semibold text-slate-900 mb-3 flex items-center gap-2 shrink-0">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-900 shrink-0"></span>
            동작 시연
          </h2>
          <div class="bg-slate-100 rounded-lg overflow-hidden w-full flex-1 flex items-center justify-center min-h-0">
            <video class="max-w-full max-h-full object-contain block bg-black rounded-lg" controls>
              <source src="project10.mp4" type="video/mp4" />
            </video>
          </div>
        </section>
      </div>

    </main>

  </div>

</body>
</html>
