<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캡스톤 디자인 포트폴리오</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen py-10 px-4 sm:px-8">

  <div class="max-w-6xl mx-auto">
    <!-- 1. Header -->
    <header class="mb-10 text-center sm:text-left border-b border-slate-200 pb-8">
      <div class="inline-block bg-blue-50 text-blue-600 text-xs sm:text-sm font-semibold px-3 py-1 rounded-full mb-3 border border-blue-200">
        ENGINEERING PORTFOLIO
      </div>
      <h1 class="text-2xl sm:text-4xl font-bold tracking-tight text-slate-900 mb-2">
        캡스톤 디자인 - 자동화 제어 & 메커니즘 프로젝트
      </h1>
      <p class="text-slate-500 text-sm sm:text-base">
        PLC 및 HMI 제어 기반의 자동화 메커니즘 설계, 시퀀스 제어 및 시스템 실증
      </p>
    </header>

    <!-- 2. Main Content Grid (이미지 및 콘텐츠 영역) -->
    <main class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
      
      <!-- Left: 이미지 카드 (잘림 없이 세로 원본 비율 완벽 보존) -->
      <section class="md:col-span-5 bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
        <div class="w-full min-h-[500px] flex items-center justify-center bg-slate-100 rounded-lg overflow-hidden p-2">
          <img 
            src="capstone_front.jpg" 
            alt="캡스톤 메인 이미지" 
            class="w-full h-auto max-h-[700px] object-contain rounded-md"
          />
        </div>
        <p class="text-xs text-center text-slate-400 mt-3">capstone_front.jpg</p>
      </section>

      <!-- Right: 포트폴리오 메인 상세 영역 -->
      <section class="md:col-span-7 space-y-6">
        
        <!-- 보조 이미지 / 서브 패널 -->
        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
          <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-600"></span>
            제어 패널 구성 (capstone_panel.jpg)
          </h2>
          <div class="bg-slate-100 rounded-lg p-2 flex justify-center items-center">
            <img 
              src="capstone_panel.jpg" 
              alt="제어 패널 이미지" 
              class="w-full h-auto max-h-[350px] object-contain rounded-md"
            />
          </div>
        </div>

        <!-- 시연 동영상 -->
        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
          <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-600"></span>
            동작 시연 영상 (capstone_demo.mp4)
          </h2>
          <div class="rounded-lg overflow-hidden bg-black">
            <video class="w-full h-auto rounded-lg" controls>
              <source src="capstone_demo.mp4" type="video/mp4" />
              브라우저가 비디오 태그를 지원하지 않습니다.
            </video>
          </div>
        </div>

      </section>

    </main>
  </div>

</body>
</html>
